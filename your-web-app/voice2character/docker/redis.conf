# Redis設定ファイル
# voice2character タスクキュー用

# ネットワーク設定
# すべてのインターフェースでリッスン（Docker環境用）
bind 0.0.0.0
port 6379

# 保護モード無効（Docker内部ネットワークのため）
protected-mode no

# メモリ設定
# メモリ上限: 512MB
maxmemory 512mb

# メモリポリシー: allkeys-lru
# メモリ上限到達時、最も長く使用されていないキーから削除
maxmemory-policy allkeys-lru

# メモリ使用量のサンプル数（LRU精度の調整）
maxmemory-samples 5

# AOF（Append Only File）永続化設定
# AOF永続化を有効化
appendonly yes

# AOFファイル名
appendfilename "appendonly.aof"

# AOF同期ポリシー（毎秒書き込み: パフォーマンスと安全性のバランス）
appendfsync everysec

# AOFリライト中のfsync無効化（パフォーマンス優先）
no-appendfsync-on-rewrite no

# AOF自動リライトの閾値
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB永続化設定（AOFと併用）
# 900秒以内に1回以上の変更があればスナップショット保存
save 900 1
# 300秒以内に10回以上の変更があればスナップショット保存
save 300 10
# 60秒以内に10000回以上の変更があればスナップショット保存
save 60 10000

# RDBファイル名
dbfilename dump.rdb

# データ保存ディレクトリ
dir /data

# ログレベル: notice（通常運用向け）
loglevel notice

# ログファイル（空文字で標準出力へ出力）
logfile ""

# クライアント接続設定
# 最大クライアント接続数
maxclients 100

# クライアントアイドルタイムアウト（0で無効）
timeout 0

# TCP keepalive（秒）
tcp-keepalive 300

# スロークエリログ設定
# 10ミリ秒以上かかるクエリをログに記録
slowlog-log-slower-than 10000

# スロークエリログの最大保持件数
slowlog-max-len 128
