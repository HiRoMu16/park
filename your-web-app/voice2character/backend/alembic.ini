# Alembic設定ファイル
# Voice2Characterデータベースマイグレーション

[alembic]
# マイグレーションスクリプトの格納ディレクトリ
script_location = alembic

# 使用するPythonパス区切り文字
prepend_sys_path = .

# テンプレートファイルのパスフォーマット
# file_template = %%(rev)s_%%(slug)s

# タイムゾーン設定（Falseでデフォルトのlocaltimeを使用）
# timezone =

# SQLAlchemyのDB接続URL（env.pyで動的に設定するため、ここは空）
# sqlalchemy.url はenv.py内でapp.config.settingsから取得する
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
