<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>運動解析プロトタイプ</title>
    <style>
        /* (前回と同じCSSなので省略) */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f4f4f4; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        #videoContainer {
            position: relative;
            width: fit-content; 
            border: 1px solid #ccc;
            background-color: #000;
        }
        #videoPlayer {
            display: block;
            max-width: 80vw;
            max-height: 70vh;
            height: auto;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        #controls { margin: 15px 0; }
        #analyzeButton { 
            background-color: #007bff; color: white; border: none; 
            padding: 10px 15px; border-radius: 5px; cursor: pointer;
        }
        #analyzeButton:disabled { background-color: #aaa; }
        #loading { display: none; margin-left: 10px; color: #555; font-style: italic; }
    </style>
</head>
<body>

    <h2>運動解析 Webアプリケーション (ステップ4: キネマティクス)</h2>
    <p>動画を解析し、フィルター処理後のスケルトンと右手首の速度ベクトルを表示します。</p>

    <div id="controls">
        <input type="file" id="videoInput" accept="video/*">
        <button id="analyzeButton">1. 解析実行</button>
        <span id="loading">解析中... (フィルター処理のため時間がかかります)</span>
    </div>

    <div id="videoContainer">
        <video id="videoPlayer" controls></video>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
        // HTML要素の取得
        const videoInput = document.getElementById('videoInput');
        const analyzeButton = document.getElementById('analyzeButton');
        const videoPlayer = document.getElementById('videoPlayer');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const ctx = overlayCanvas.getContext('2d');
        const loading = document.getElementById('loading');

        // 解析データを保持する変数
        let landmarksData = [];
        let kinematicsData = {}; // ★追加: 速度データ用
        let videoFPS = 30;
        let totalFrames = 0;
        let videoFile = null;

        // MediaPipe Poseの接続情報 (スケルトン描画用)
        const POSE_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 7], [0, 4], [4, 5], [5, 6], [6, 8], [9, 10],
            [11, 12], [11, 13], [13, 15], [15, 17], [15, 19], [15, 21], [17, 19],
            [12, 14], [14, 16], [16, 18], [16, 20], [16, 22], [18, 20],
            [11, 23], [12, 24], [23, 24],
            [23, 25], [25, 27], [27, 29], [27, 31], [29, 31],
            [24, 26], [26, 28], [28, 30], [28, 32], [30, 32]
        ];

        // --- イベントリスナーの設定 ---

        videoInput.addEventListener('change', (event) => {
            videoFile = event.target.files[0];
            if (videoFile) {
                const fileURL = URL.createObjectURL(videoFile);
                videoPlayer.src = fileURL;
                landmarksData = [];
                kinematicsData = {}; // ★追加
                ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            }
        });

        videoPlayer.addEventListener('loadedmetadata', () => {
            overlayCanvas.width = videoPlayer.videoWidth;
            overlayCanvas.height = videoPlayer.videoHeight;
        });

        analyzeButton.addEventListener('click', async () => {
            if (!videoFile) {
                alert("まず動画ファイルを選択してください。");
                return;
            }
            loading.style.display = 'inline';
            analyzeButton.disabled = true;

            const formData = new FormData();
            formData.append('video', videoFile);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json(); // ★レスポンスをまず受け取る

                if (!response.ok) {
                    // ★エラーが 'error' キーに含まれて返ってくる
                    throw new Error(data.error || `サーバーエラー: ${response.status}`);
                }
                
                landmarksData = data.landmarksData;
                kinematicsData = data.kinematicsData; // ★追加
                videoFPS = data.fps;
                totalFrames = data.totalFrames;

                alert(`解析が完了しました。\nFPS: ${videoFPS.toFixed(2)}, 総フレーム数: ${totalFrames}`);
                requestAnimationFrame(drawLoop);

            } catch (error) {
                console.error("解析エラー:", error);
                alert(`解析中にエラーが発生しました:\n${error.message}`); // ★詳細なエラーを表示
            } finally {
                loading.style.display = 'none';
                analyzeButton.disabled = false;
            }
        });

        // 描画ループ
        function drawLoop() {
            if (landmarksData.length === 0) {
                requestAnimationFrame(drawLoop);
                return;
            }

            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            const currentTime = videoPlayer.currentTime;
            let currentFrameIndex = Math.floor(currentTime * videoFPS);
            if (currentFrameIndex >= totalFrames) currentFrameIndex = totalFrames - 1;
            if (currentFrameIndex < 0) currentFrameIndex = 0;

            const landmarks = landmarksData[currentFrameIndex];

            if (landmarks && landmarks.length > 0) {
                // スケルトン描画
                drawSkeleton(landmarks);
                
                // ★追加: 速度ベクトルの描画 (右手首: 16)
                if (kinematicsData.right_wrist_velocity && kinematicsData.right_wrist_velocity[currentFrameIndex]) {
                    const rightWristPos = landmarks[16]; // 右手首の「位置」
                    const rightWristVel = kinematicsData.right_wrist_velocity[currentFrameIndex]; // 右手首の「速度」
                    
                    if(rightWristPos.visibility > 0.5) {
                        drawVelocityVector(rightWristPos, rightWristVel, "yellow");
                    }
                }
            }
            requestAnimationFrame(drawLoop);
        }

        // スケルトン描画関数 (前回と同じ)
        function drawSkeleton(landmarks) {
            const canvasWidth = overlayCanvas.width;
            const canvasHeight = overlayCanvas.height;
            const visibilityThreshold = 0.5; 

            ctx.strokeStyle = 'lime';
            ctx.lineWidth = 3;

            POSE_CONNECTIONS.forEach(connection => {
                const startIdx = connection[0];
                const endIdx = connection[1];
                if (landmarks[startIdx] && landmarks[endIdx]) {
                    const start = landmarks[startIdx];
                    const end = landmarks[endIdx];
                    if (start.visibility > visibilityThreshold && end.visibility > visibilityThreshold) {
                        ctx.beginPath();
                        ctx.moveTo(start.x * canvasWidth, start.y * canvasHeight);
                        ctx.lineTo(end.x * canvasWidth, end.y * canvasHeight);
                        ctx.stroke();
                    }
                }
            });

            ctx.fillStyle = 'red';
            landmarks.forEach(landmark => {
                if (landmark.visibility > visibilityThreshold) {
                    ctx.beginPath();
                    ctx.arc(landmark.x * canvasWidth, landmark.y * canvasHeight, 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });
        }
        
        // ★追加: 速度ベクトル（矢印）を描画する関数
        function drawVelocityVector(startPos, velocityVec, color) {
            const canvasWidth = overlayCanvas.width;
            const canvasHeight = overlayCanvas.height;
            
            // 速度のスケーリング (この値を調整して矢印の長さを変える)
            // 速度は [座標単位/秒] (0.0~1.0の範囲)。
            // 例えば 1.0 の速度 (画面の端から端まで1秒) なら 300px で描画する
            const scale = 300; 

            const startX = startPos.x * canvasWidth;
            const startY = startPos.y * canvasHeight;
            
            // 速度ベクトル (vx, vy)
            // MediaPipeの座標系 (yが下向き) とCanvasの座標系は一致している
            const vx = velocityVec[0]; // x速度
            const vy = velocityVec[1]; // y速度

            const endX = startX + (vx * scale);
            const endY = startY + (vy * scale);

            // 矢印の描画
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            // 矢印の本体 (線)
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // 矢印の先端 (三角形)
            const headlen = 10; // 矢印の先端の長さ
            const angle = Math.atan2(endY - startY, endX - startX);
            
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - headlen * Math.cos(angle - Math.PI / 6), endY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(endX - headlen * Math.cos(angle + Math.PI / 6), endY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(endX, endY);
            ctx.fill();
        }
        
        requestAnimationFrame(drawLoop);
    </script>
</body>
</html>
